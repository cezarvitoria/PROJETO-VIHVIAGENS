<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Planner de Viagens</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#2d2a32;--mut:#7b7684;--pri:#5b8def;--pri2:#e7efff;--acc:#f2a477;--bd:#e8e3da;--ok:#4aa37a;--bad:#d9646a;--sh:0 4px 18px rgba(60,50,40,.08);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a1f;--card:#26242c;--tx:#f0edf3;--mut:#a39fad;--pri:#7ea5ff;--pri2:#2c3550;--bd:#38353f;--sh:0 4px 18px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
#app{display:flex;min-height:100vh}
aside{width:236px;background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.logo{font-weight:700;font-size:18px;margin-bottom:6px}.logo span{color:var(--pri)}
.me{font-size:12px;color:var(--mut);margin:0 0 10px 2px}
.nav{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;color:var(--mut);display:block}
.nav:hover,.nav.on{background:var(--pri2);color:var(--pri)}.nav.on{font-weight:600}
.sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 12px 4px}
main{flex:1;padding:26px;min-width:0;max-width:1200px;margin:0 auto}
h1{margin:0 0 4px;font-size:26px}h2{font-size:18px;margin:26px 0 12px}.sub{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--pri2);color:var(--pri)}.btn.red{background:var(--bad)}.btn.sm{padding:6px 10px;font-size:13px}
.link{background:none;border:0;color:var(--pri);cursor:pointer;font:inherit;padding:0}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--bd);overflow:hidden}
.trip .cv{height:164px;background:linear-gradient(120deg,#6c8ca8,#b8c6b1);background-size:cover;background-position:center;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:12px;color:white;position:relative}.cv b{position:relative;text-shadow:0 1px 4px rgba(0,0,0,.45)}.cover-pick{font-size:11px;background:rgba(20,25,30,.68);color:white;border:1px solid rgba(255,255,255,.55);border-radius:8px;padding:7px 9px;cursor:pointer;white-space:nowrap}.cover-pick input{display:none}
.trip .bd{padding:14px 16px}.trip h3{margin:0 0 2px;font-size:17px}
.trip p{margin:8px 0;color:var(--mut);font-size:13px;min-height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px}.stat small{color:var(--mut)}.stat div{font-size:22px;font-weight:700;margin-top:2px}
.trip-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cal{padding:14px}.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;color:var(--mut);font-size:12px;margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{min-height:92px;border:1px solid var(--bd);border-radius:12px;padding:5px;overflow:hidden;background:var(--bg)}
.cell.in{background:var(--card);border-color:var(--pri)}.cell.out{opacity:.5}.cell.today .n{background:var(--acc);color:#fff}
.n{display:inline-block;min-width:22px;text-align:center;border-radius:99px;font-size:12px;font-weight:600}
.chip{font-size:11px;background:var(--pri2);color:var(--pri);border-radius:6px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mut)}
.act{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--bd)}
.ic{font-size:24px;width:42px;height:42px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;flex-shrink:0}
.act .t{font-weight:600}.act .m{color:var(--mut);font-size:13px}.act a{color:var(--pri)}
.tag{font-size:12px;background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:99px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}td.r,th.r{text-align:right}
.bar{height:6px;background:var(--pri2);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
textarea.notes{width:100%;min-height:55vh;border:0;padding:18px;font:inherit;background:var(--card);color:var(--tx);border-radius:20px;line-height:1.7}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.on{display:flex}.mb{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mut);padding:34px}
.panel{padding:18px}.actions{display:flex;gap:6px;flex-wrap:wrap}
.kpi,.small{font-size:13px;color:var(--mut)}
.calendar-wrap{overflow:auto}.item-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.photo-section{padding:14px;border-top:1px solid var(--bd)}
.photo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
.photo-thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--bd)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo-thumb button{position:absolute;top:5px;right:5px;padding:3px 7px;border:0;border-radius:8px;background:rgba(30,30,30,.8);color:white;cursor:pointer}
.photo-caption{font-size:12px;color:var(--mut);padding:4px 2px;overflow-wrap:anywhere}
.photo-empty{font-size:13px;color:var(--mut);padding:8px 0}
.photo-upload{display:inline-block;cursor:pointer}
.photo-upload input{display:none}
.photo-viewer{max-width:100%;max-height:68vh;object-fit:contain;display:block;margin:12px auto;border-radius:12px}
.schedule-day{padding:14px 16px;border-bottom:1px solid var(--bd)}.schedule-day:last-child{border-bottom:0}.schedule-date{font-weight:700;margin-bottom:10px;color:var(--pri)}.schedule-item{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:9px 0}.schedule-time{font-weight:700;font-size:13px;color:var(--mut)}.schedule-name{font-weight:700}.schedule-meta{font-size:12px;color:var(--mut);margin-top:3px}.schedule-notes{font-size:13px;margin-top:5px;white-space:pre-wrap}
.calendar-agenda{margin-top:18px;padding:16px}.calendar-agenda h2{margin:0 0 12px}.agenda-day{padding:12px 0;border-bottom:1px solid var(--bd)}.agenda-day:last-child{border:0}.agenda-date{font-weight:700;color:var(--pri);margin-bottom:7px}.agenda-row{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:6px 0}.agenda-time{font-size:13px;font-weight:700;color:var(--mut)}.agenda-title{font-weight:600}.agenda-trip{font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2d2a32;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:800px){
#app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px;align-items:center;gap:3px}
.me,.sep{display:none}.logo{margin:0 10px 0 4px}main{padding:16px}.two{grid-template-columns:1fr}
.cell{min-height:58px}.chip{display:none}aside .nav{padding:8px 10px;font-size:13px}
}

#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:var(--sh)}
.auth-card h1{margin-bottom:6px}.auth-card p{color:var(--mut);margin-top:0}
.auth-card button{width:100%;margin-top:12px}.auth-error{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
#app[hidden],#auth-screen[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
<aside>
<div class="logo">🧭 Meu <span>Planner</span></div>
<p class="me" id="account-label">Suas viagens em um só lugar</p><button class="nav" id="logout">↪ Sair da conta</button>
<button class="nav on" data-page="home">🏠 Visão geral</button>
<button class="nav" data-page="trips">🧳 Minhas viagens</button>
<button class="nav" data-page="calendar">📅 Calendário</button>
<button class="nav" data-page="expenses">💰 Despesas</button>
<button class="nav" data-page="notes">📝 Anotações</button>
<div class="sep">Preferências</div>
<button class="nav" data-page="settings">⚙️ Configurações</button>
<div style="margin-top:auto;padding:10px 8px;color:var(--mut);font-size:11px">Seus dados ficam salvos neste navegador.</div>
</aside>
<main id="main"></main>
</div>
<div id="modal"><div class="mb" id="mb"></div></div>
<div id="toast"></div>
<script>
    (() => {
'use strict';

const KEY='meuPlannerViagens_v1';
const CATS={
alimentacao:'🍽️ Alimentação',
hospedagem:'🛏️ Hospedagem',
combustivel:'⛽ Combustível',
transporte:'🚗 Transporte',
passeios:'🎟️ Passeios',
compras:'🛍️ Compras',
outros:'📦 Outros'
};

let db=load(),page='home',currentTrip=null,calDate=new Date();

function load(){
try{
return JSON.parse(localStorage.getItem(KEY))||{
trips:[],settings:{name:'Meu Planner de Viagens'}
};
}catch(e){
return {trips:[],settings:{name:'Meu Planner de Viagens'}};
}
}

function save(){
localStorage.setItem(KEY,JSON.stringify(db));
if(cloudReady && currentUser) syncCloud();
}

function id(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function money(v){
return Number(v||0).toLocaleString('pt-BR',{
style:'currency',currency:'BRL'
});
}

function date(v){
if(!v)return 'Data não definida';
return new Date(v+'T12:00:00').toLocaleDateString('pt-BR');
}

function esc(s=''){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}

function notify(s){
const t=document.getElementById('toast');
t.textContent=s;
t.classList.add('on');
setTimeout(()=>t.classList.remove('on'),2300);
}

function tripExpenseRows(t){
const manual=(t.expenses||[]).map(e=>({...e,source:'manual'}));
const estimated=(t.acts||[]).flatMap(a=>{
const items=a.costItems&&a.costItems.length?a.costItems:(Number(a.cost||0)>0?[{value:a.cost,note:'Custo estimado da atividade'}]:[]);
return items.filter(item=>Number(item.value||0)>0).map((item,index)=>({
id:'estimated-'+a.id+'-'+index,descr:item.note||('Custo estimado: '+a.name),
date:a.date||'',cat:a.cat||'outros',amount:Number(item.value||0),source:'activity',activity:a.name
}));
});
return [...manual,...estimated];
}
function totalExpenses(t){
return tripExpenseRows(t).reduce((sum,x)=>sum+Number(x.amount||0),0);
}

function tripBy(id){
return db.trips.find(t=>t.id===id);
}

function setPage(p){
page=p;
currentTrip=null;
document.querySelectorAll('.nav').forEach(b=>
b.classList.toggle('on',b.dataset.page===p)
);
render();
}

document.querySelectorAll('.nav').forEach(b=>
b.addEventListener('click',()=>setPage(b.dataset.page))
);

function modal(content){
document.getElementById('mb').innerHTML=content;
document.getElementById('modal').classList.add('on');
}

function closeModal(){
document.getElementById('modal').classList.remove('on');
}

document.getElementById('modal').addEventListener('click',e=>{
if(e.target.id==='modal')closeModal();
});

function field(label,name,value='',type='text',extra=''){
return `<label>${label}</label>
<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`;
}

function tripForm(t={}){
modal(`<h2>${t.id?'Editar':'Nova'} viagem</h2>
<form id="tripForm">
${field('Nome da viagem *','name',t.name||'')}
${field('Destino','dest',t.dest||'')}
<div class="two">
<div>${field('Data de início','start_date',t.start_date||'','date')}</div>
<div>${field('Data de término','end_date',t.end_date||'','date')}</div>
</div>
${field('Orçamento previsto (R$)','budget',t.budget??'','number','min="0" step="0.01"')}
<label>Descrição</label>
<textarea name="descr" rows="3">${esc(t.descr||'')}</textarea>
<div class="actions" style="margin-top:18px">
<button class="btn" type="submit">Salvar viagem</button>
<button class="btn ghost" type="button" id="cancel">Cancelar</button>
</div>
</form>`);

document.getElementById('cancel').onclick=closeModal;

document.getElementById('tripForm').onsubmit=e=>{
e.preventDefault();
let f=new FormData(e.target);
let o=Object.fromEntries(f);

if(!o.name.trim())return notify('Informe o nome da viagem.');

if(t.id){
Object.assign(t,o,{budget:Number(o.budget||0)});
}else{
db.trips.push({
...o,id:id(),budget:Number(o.budget||0),
acts:[],expenses:[],notes:''
});
}

save();
closeModal();
render();
notify('Viagem salva!');
};
}

function render(){
const main=document.getElementById('main');

if(page==='home')main.innerHTML=home();
else if(page==='trips')main.innerHTML=trips();
else if(page==='calendar')main.innerHTML=calendar();
else if(page==='expenses')main.innerHTML=expenses();
else if(page==='notes')main.innerHTML=notes();
else if(page==='settings')main.innerHTML=settings();

bind();
}

function home(){
let all=db.trips.length;

let upcoming=db.trips.filter(t=>
t.start_date&&t.start_date>=new Date().toISOString().slice(0,10)
).length;

let spent=db.trips.reduce((a,t)=>a+totalExpenses(t),0);
let budget=db.trips.reduce((a,t)=>a+Number(t.budget||0),0);

return `
<div class="top">
<div>
<h1>Olá, viajante! 👋</h1>
<div class="sub">Organize suas próximas aventuras.</div>
</div>
<button class="btn" id="newTrip">＋ Nova viagem</button>
</div>

<div class="stats">
<div class="card stat"><small>Viagens planejadas</small><div>${all}</div></div>
<div class="card stat"><small>Próximas viagens</small><div>${upcoming}</div></div>
<div class="card stat"><small>Despesas registradas</small><div>${money(spent)}</div></div>
<div class="card stat"><small>Orçamento total</small><div>${money(budget)}</div></div>
</div>

<h2>Suas viagens</h2>

${db.trips.length?
`<div class="trip-list">
${db.trips.slice().sort((a,b)=>
(a.start_date||'').localeCompare(b.start_date||'')
).slice(0,6).map(tripCard).join('')}
</div>`:
`<div class="card empty">
<div style="font-size:38px">🧳</div>
<p>Você ainda não tem viagens cadastradas.</p>
<button class="btn" id="newTripEmpty">
Planejar minha primeira viagem
</button>
</div>`
}`;
}

function tripCard(t){
let spent=totalExpenses(t);
let pct=t.budget?Math.min(100,spent/t.budget*100):0;

return `
<article class="card trip">
<div class="cv" data-cover-trip="${t.id}"><b>${t.start_date?date(t.start_date):'Viagem'}</b><label class="cover-pick">📷 Adicionar capa<input type="file" accept="image/*"></label></div>
<div class="bd">
<h3>${esc(t.name)}</h3>
<div class="sub small">📍 ${esc(t.dest||'Destino não definido')}</div>
<p>${esc(t.descr||'Sem descrição adicionada.')}</p>
<div class="kpi">
${date(t.start_date)} ${t.end_date?'— '+date(t.end_date):''}
</div>
<div class="bar"><i style="width:${pct}%"></i></div>
<div class="row small" style="justify-content:space-between;margin:5px 0 12px">
<span>${money(spent)} gastos</span>
<span>Orçamento: ${money(t.budget)}</span>
</div>
<div class="actions">
<button class="btn sm" data-open="${t.id}">Abrir viagem</button>
<button class="btn ghost sm" data-edit="${t.id}">Editar</button>
<button class="btn red sm" data-delete="${t.id}">Excluir</button>
</div>
</div>
</article>`;
}

function trips(){
return `
<div class="top">
<div>
<h1>Minhas viagens</h1>
<div class="sub">Crie e gerencie seus planos.</div>
</div>
<button class="btn" id="newTrip">＋ Nova viagem</button>
</div>
<div class="trip-list">
${db.trips.length?
db.trips.map(tripCard).join(''):
'<div class="card empty">Nenhuma viagem cadastrada ainda.</div>'}
</div>`;
}
function detail(t){
return `
<div class="top">
<div>
<button class="link" id="backTrips">← Voltar às viagens</button>
<h1>${esc(t.name)}</h1>
<div class="sub">📍 ${esc(t.dest||'Destino não definido')} · ${date(t.start_date)} ${t.end_date?'— '+date(t.end_date):''}</div>
</div>
<button class="btn" id="addAct">＋ Adicionar atividade</button>
</div>
<div class="photo-section card" style="margin-bottom:16px"><div class="photo-head"><strong>📷 Fotos da viagem</strong><span class="small">Imagens gerais desta viagem</span></div><div data-photo-gallery data-owner-type="trip" data-owner-id="${t.id}"></div></div><div class="tabs">
<button class="on" data-tab="acts">Roteiro (${t.acts.length})</button>
<button data-tab="schedule">Cronograma</button>
<button data-tab="expenses">Despesas (${t.expenses.length})</button>
<button data-tab="notes">Anotações</button>
</div>
<div id="tripTab">${actsView(t)}</div>`;
}

function scheduleView(t){
const activities=(t.acts||[]).slice().sort((a,b)=>((a.date||'9999-99-99')+(a.st||'99:99')).localeCompare((b.date||'9999-99-99')+(b.st||'99:99')));
if(!activities.length)return '<div class="card empty">Adicione atividades com datas e horários para montar o cronograma da viagem.</div>';
const dated=activities.filter(a=>a.date),undated=activities.filter(a=>!a.date);
const groups={};dated.forEach(a=>(groups[a.date]??=[]).push(a));
return '<div class="card">'+Object.entries(groups).map(([day,items])=>'<section class="schedule-day"><div class="schedule-date">📅 '+date(day)+'</div>'+items.map(a=>'<div class="schedule-item"><div class="schedule-time">'+(a.st||'Sem horário')+(a.et?' – '+a.et:'')+'</div><div><div class="schedule-name">'+esc(a.name)+'</div><div class="schedule-meta">'+(CATS[a.cat]||'Outros')+(a.place?' · 📍 '+esc(a.place):'')+'</div>'+(a.notes?'<div class="schedule-notes">'+esc(a.notes)+'</div>':'')+'</div></div>').join('')+'</section>').join('')+(undated.length?'<section class="schedule-day"><div class="schedule-date">📌 Sem data definida</div>'+undated.map(a=>'<div class="schedule-item"><div class="schedule-time">'+(a.st||'Sem horário')+'</div><div><div class="schedule-name">'+esc(a.name)+'</div>'+(a.place?'<div class="schedule-meta">📍 '+esc(a.place)+'</div>':'')+'</div></div>').join('')+'</section>':'')+'</div>';
}

function actsView(t){
return t.acts.length?
`<div class="card">
${t.acts.slice().sort((a,b)=>(a.date+a.st).localeCompare(b.date+b.st)).map(a=>`
<div class="act">
<div class="ic">${CATS[a.cat]?.split(' ')[0]||'📌'}</div>
<div style="min-width:0;flex:1">
<div class="t">${esc(a.name)} <span class="tag">${esc(CATS[a.cat]||'Outros')}</span></div>
<div class="m">${date(a.date)} ${a.st?'· '+a.st:''} ${a.place?'· '+esc(a.place):''}</div>
${a.notes?`<div class="small">${esc(a.notes)}</div>`:''}
${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener">Abrir link</a>`:''}
<div class="photo-section" style="padding:10px 0 0;border:0"><div class="photo-head"><strong class="small">📷 Fotos desta atividade</strong></div><div data-photo-gallery data-owner-type="activity" data-owner-id="${a.id}"></div></div>
</div>
<div class="item-actions">
<button class="btn ghost sm" data-edit-act="${a.id}">Editar</button>
<button class="btn red sm" data-del-act="${a.id}">×</button>
</div>
</div>`).join('')}
</div>`:

// Fotos guardadas no IndexedDB deste navegador, separadas por viagem e atividade.
const PHOTO_DB='plannerViagensFotos';
function openPhotoDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(PHOTO_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function photoRequest(mode,action,value){const database=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=database.transaction('photos',mode),store=tx.objectStore('photos');const req=action==='all'?store.getAll():action==='put'?store.put(value):store.delete(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>database.close();tx.onerror=()=>reject(tx.error);});}
function fileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file);});}
function photoMarkup(photos){return '<label class="btn ghost sm photo-upload">＋ Adicionar fotos<input type="file" accept="image/*" multiple></label><div class="photo-grid" style="margin-top:10px">'+photos.map(p=>'<div><div class="photo-thumb"><img src="'+p.dataUrl+'" alt="'+esc(p.caption||p.name)+'" data-view-photo="'+p.id+'"><button type="button" data-remove-photo="'+p.id+'">×</button></div><div class="photo-caption">'+esc(p.caption||p.name)+'</div></div>').join('')+'</div>'+(photos.length?'':'<div class="photo-empty">Nenhuma foto adicionada ainda.</div>');}
async function refreshPhotoGallery(box){const type=box.dataset.ownerType,owner=box.dataset.ownerId;const all=await photoRequest('readonly','all');const photos=all.filter(p=>p.ownerType===type&&p.ownerId===owner).sort((a,b)=>a.createdAt-b.createdAt);box.innerHTML=photoMarkup(photos);bindPhotoGalleryControls(box,photos);}
function bindPhotoGalleryControls(box,photos){const input=box.querySelector('input[type=file]');if(input)input.onchange=async()=>{const files=Array.from(input.files||[]);try{for(const file of files){if(!file.type.startsWith('image/'))continue;const dataUrl=await fileData(file);const caption=prompt('Legenda para esta foto (opcional):','')||'';await photoRequest('readwrite','put',{id:id(),ownerType:box.dataset.ownerType,ownerId:box.dataset.ownerId,name:file.name,caption,dataUrl,createdAt:Date.now()});}notify('Foto(s) adicionada(s)!');await refreshPhotoGallery(box);}catch(err){console.error(err);notify('Não foi possível salvar. Tente imagens menores.');}};box.querySelectorAll('[data-remove-photo]').forEach(btn=>btn.onclick=async()=>{if(!confirm('Excluir esta foto?'))return;await photoRequest('readwrite','delete',btn.dataset.removePhoto);await refreshPhotoGallery(box);});box.querySelectorAll('[data-view-photo]').forEach(img=>img.onclick=()=>{const photo=photos.find(p=>p.id===img.dataset.viewPhoto);if(!photo)return;modal('<div class="photo-head"><strong>'+esc(photo.caption||photo.name)+'</strong><button class="btn ghost sm" id="closePhoto">Fechar</button></div><img class="photo-viewer" src="'+photo.dataUrl+'" alt="'+esc(photo.caption||photo.name)+'">');const close=document.getElementById('closePhoto');if(close)close.onclick=closeModal;});}
async function bindTripCovers(){
document.querySelectorAll('[data-cover-trip]').forEach(async box=>{
const tripId=box.dataset.coverTrip;
try{const all=await photoRequest('readonly','all');const cover=all.find(p=>p.ownerType==='trip-cover'&&p.ownerId===tripId);if(cover)box.style.backgroundImage='linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.03)),url('+JSON.stringify(cover.dataUrl)+')';}catch(err){console.error(err);}
const input=box.querySelector('input[type=file]');
if(input)input.onchange=async()=>{const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){notify('Escolha um arquivo de imagem.');return;}try{const all=await photoRequest('readonly','all');const previous=all.filter(p=>p.ownerType==='trip-cover'&&p.ownerId===tripId);for(const p of previous)await photoRequest('readwrite','delete',p.id);const dataUrl=await fileData(file);await photoRequest('readwrite','put',{id:id(),ownerType:'trip-cover',ownerId:tripId,name:file.name,caption:'Capa da viagem',dataUrl,createdAt:Date.now()});box.style.backgroundImage='linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,.03)),url('+JSON.stringify(dataUrl)+')';notify('Capa da viagem salva!');}catch(err){console.error(err);notify('Não foi possível salvar a capa. Tente uma imagem menor.');}};
});
}
async function bindPhotoGalleries(){document.querySelectorAll('[data-photo-gallery]').forEach(async box=>{box.innerHTML='<div class="photo-empty">Carregando fotos...</div>';try{await refreshPhotoGallery(box);}catch(err){console.error(err);box.innerHTML='<div class="photo-empty">Não foi possível carregar as fotos neste navegador.</div>';}});}

function calendar(){
let y=calDate.getFullYear();
let m=calDate.getMonth();
let first=new Date(y,m,1);
let start=new Date(y,m,1-first.getDay());
let days=[];

for(let i=0;i<42;i++){
let d=new Date(start);
d.setDate(start.getDate()+i);
days.push(d);
}

let today=new Date().toISOString().slice(0,10);
let allActivities=db.trips.flatMap(t=>(t.acts||[]).filter(a=>a.date).map(a=>({...a,trip:t.name,tripId:t.id}))).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.st||'99:99').localeCompare(b.st||'99:99')||a.name.localeCompare(b.name));
let agendaGroups={};allActivities.forEach(a=>(agendaGroups[a.date]??=[]).push(a));

return `
<div class="top">
<div>
<h1>Calendário</h1>
<div class="sub">Visualize as atividades das suas viagens.</div>
</div>
<div class="actions">
<button class="btn ghost" id="prevMonth">←</button>
<strong>${calDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong>
<button class="btn ghost" id="nextMonth">→</button>
</div>
</div>

<div class="card cal calendar-wrap">
<div class="calh">
${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div>${x}</div>`).join('')}
</div>
<div class="cg">
${days.map(d=>{
let ds=d.toISOString().slice(0,10);
let items=db.trips.flatMap(t=>(t.acts||[]).map(a=>({...a,trip:t.name}))).filter(a=>a.date===ds).sort((a,b)=>(a.st||'99:99').localeCompare(b.st||'99:99')||a.name.localeCompare(b.name));

return `
<div class="cell ${d.getMonth()===m?'in':'out'} ${ds===today?'today':''} ${items.length?'has':''}">
<span class="n">${d.getDate()}</span>
${items.slice(0,3).map(a=>`<div class="chip" title="${esc(a.name)} · ${esc(a.trip)}">${a.st?esc(a.st)+' · ':''}${esc(a.name)}</div>`).join('')}
${items.length>2?`<div class="more">+${items.length-2} mais</div>`:''}
</div>`;
}).join('')}
</div>
</div>
<div class="card calendar-agenda"><h2>Agenda de todas as viagens</h2>${Object.keys(agendaGroups).length?Object.entries(agendaGroups).map(([day,items])=>`<section class="agenda-day"><div class="agenda-date">📅 ${date(day)}</div>${items.map(a=>`<div class="agenda-row"><div class="agenda-time">${a.st?esc(a.st):'Sem horário'}${a.et?' – '+esc(a.et):''}</div><div><div class="agenda-title">${esc(a.name)}</div><div class="agenda-trip">${esc(a.trip)}${a.place?' · 📍 '+esc(a.place):''}</div></div></div>`).join('')}</section>`).join(''):'<div class="sub">Ainda não há atividades com data cadastrada nas viagens.</div>'}</div>
<p class="sub small">As atividades de todas as viagens são organizadas por data e horário, da primeira à última.</p>
`;

    if(rows.length===0 && db.trips.length){
      const payload=db.trips.map(t=>({id:String(t.id),owner_id:currentUser.id,name:t.name||'Viagem',trip_data:t}));
      const {error:upErr}=await supabaseClient.from('trips').upsert(payload,{onConflict:'id'});
      if(upErr)throw upErr;
    }else if(rows.length){
      localStorage.setItem(KEY+'_backup_pre_cloud',JSON.stringify(db));
      db.trips=rows.map(row=>row.trip_data).filter(Boolean);
      saveLocalOnly();
    }
    cloudReady=true;
    render();
    notify('Conta conectada e viagens sincronizadas.');
  }catch(err){
    console.error(err);
    cloudReady=false;
    notify('Não foi possível sincronizar. Confira as tabelas e permissões no Supabase.');
  }
}
function saveLocalOnly(){localStorage.setItem(KEY,JSON.stringify(db));}
async function syncCloud(){
  if(!currentUser||!cloudReady)return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(async()=>{
    const payload=db.trips.map(t=>({id:String(t.id),owner_id:currentUser.id,name:t.name||'Viagem',trip_data:t}));
    if(!payload.length)return;
    const {error}=await supabaseClient.from('trips').upsert(payload,{onConflict:'id'});
    if(error){console.error(error);notify('Erro ao salvar na nuvem.');}
  },500);
}
async function deleteCloudTrip(tripId){
  if(!currentUser||!cloudReady)return;
  const {error}=await supabaseClient.from('trips').delete().eq('id',String(tripId));
  if(error){console.error(error);notify('Não foi possível excluir a viagem da nuvem.');}
}
document.getElementById('auth-toggle').onclick=()=>showAuth(authMode==='login'?'signup':'login');
document.getElementById('auth-form').onsubmit=async e=>{
  e.preventDefault();authMessage('');
  const email=document.getElementById('auth-email').value.trim();
  const password=document.getElementById('auth-password').value;
  const submit=document.getElementById('auth-submit');submit.disabled=true;
  try{
    if(authMode==='signup'){
      const {data,error}=await supabaseClient.auth.signUp({email,password});
      if(error)throw error;
      if(data.session)await applySession(data.session);
      else authMessage('Cadastro iniciado. Verifique seu e-mail para confirmar a conta.');
    }else{
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;
      await applySession(data.session);
    }
  }catch(err){authMessage(err.message||'Não foi possível entrar.');}
  finally{submit.disabled=false;}
};
document.getElementById('logout').onclick=async()=>{
  await supabaseClient.auth.signOut();
  currentUser=null;cloudReady=false;showAuth('login');
};
supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN')applySession(session);
  if(event==='SIGNED_OUT'){currentUser=null;cloudReady=false;showAuth('login');}
});
(async()=>{
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){showAuth('login');authMessage(error.message);return;}
  await applySession(data.session);
})();

render();

})();
</script>
</body>
